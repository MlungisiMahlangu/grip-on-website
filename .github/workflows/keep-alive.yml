name: Keep alive

on:
  schedule:
    # Daily at 06:00 UTC. Free Supabase projects pause after seven days without activity.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the keep-alive endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          KEEP_ALIVE_TOKEN: ${{ secrets.KEEP_ALIVE_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository variable to the deployed origin." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer $KEEP_ALIVE_TOKEN" \
            "${SITE_URL%/}/api/keep-alive"
