<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="images/brand/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Product — Grip On</title>
    <meta name="description" content="">
    <link rel="stylesheet" href="css/style.css">
    <meta property="og:title" content="Grip On — Gym Wear Built to Hold">
    <meta property="og:description" content="Training wear made for the lifts that matter.">
    <meta property="og:image" content="images/brand/hero-generated.png">
    <meta property="og:type" content="website">
    <style>
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            padding-block: 3rem 5rem;
        }
        
        .product-media {
            aspect-ratio: 4/5;
            background: var(--ash);
            border: 1px solid var(--line);
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
        }
        
        .product-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform var(--transition-slow);
        }
        
        .product-media:hover img {
            transform: scale(1.15);
        }
        
        .product-media::after {
            content: 'Click to zoom';
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--chalk);
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: var(--radius);
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        
        .product-media:hover::after {
            opacity: 1;
        }
        
        .product-info .eyebrow {
            margin-bottom: 0.75rem;
        }
        
        .product-info h1 {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            margin-bottom: 0.75rem;
            text-transform: none;
        }
        
        .product-info .price {
            font-size: 1.4rem;
            color: var(--grip-blue);
            display: block;
            margin-bottom: 1.5rem;
        }
        
        .product-description {
            color: var(--steel);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .option-group {
            margin-bottom: 1.75rem;
        }
        
        .option-label {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--steel);
            display: block;
            margin-bottom: 0.6rem;
        }
        
        .size-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .size-btn {
            border: 1px solid var(--line);
            padding: 0.55rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        
        .size-btn:hover {
            border-color: var(--grip-blue);
        }
        
        .size-btn.active {
            border-color: var(--grip-blue);
            color: var(--grip-blue);
            background: var(--grip-blue-glow);
        }
        
        .qty-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .qty-row button {
            border: 1px solid var(--line);
            width: 2.25rem;
            height: 2.25rem;
            font-family: var(--font-mono);
        }
        
        .add-confirm {
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--grip-blue);
            display: none;
        }
        
        /* Size guide modal */
        .size-guide-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .size-guide-modal.open {
            display: flex;
        }
        
        .size-guide-content {
            background: var(--ash);
            border: 1px solid var(--line);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        
        .size-guide-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--chalk);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .size-guide-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        .size-guide-table th,
        .size-guide-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        
        .size-guide-table th {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--steel);
        }
        
        /* Related products */
        .related-products {
            margin-top: 5rem;
            padding-top: 3rem;
            border-top: 1px solid var(--line);
        }
        
        .related-products h2 {
            margin-bottom: 2rem;
        }
        
        @media (max-width: 760px) {
            .product-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="wrap nav">
            <a href="index.html" class="nav-logo">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="30" width="6" height="10" fill="currentColor"/>
        <rect x="84" y="30" width="6" height="10" fill="currentColor"/>
        <rect x="16" y="33" width="68" height="4" fill="currentColor"/>
        <path d="M38 37 L38 45 C38 55 34 58 30 62 C26 66 26 72 26 78 L26 90 L74 90 L74 78 C74 72 74 66 70 62 C66 58 62 55 62 45 L62 37 Z" fill="currentColor"/>
        <path d="M45 60 L45 78 M55 60 L55 78" stroke="var(--void)" stroke-width="3"/>
      </svg> Grip On
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html" aria-current="page">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-actions">
                <a href="cart.html" class="cart-link">Cart<span class="cart-count" id="cartCount">0</span></a>
                <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="product-detail" id="productDetail"></div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <div class="footer-bottom">
                <span>&copy; 2026 Grip On</span>
                <span>Johannesburg, South Africa</span>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        const product = findProduct(id);
        const detail = document.getElementById('productDetail');

        if (!product) {
            detail.innerHTML = `<p style="grid-column:1/-1; padding-block:4rem; text-align:center; color:var(--steel);">
      Product not found. <a href="shop.html" style="color:var(--grip-blue);">Back to shop</a></p>`;
        } else {
            document.getElementById('pageTitle').textContent = `${product.name} — Grip On`;
            const sizes = ["S", "M", "L", "XL"];
            let selectedSize = "M";
            let qty = 1;

            // Product descriptions
            const descriptions = {
                'shirts': 'Premium cotton tee with a relaxed fit. Perfect for training or everyday wear.',
                'vests': 'Lightweight and breathable vest designed for maximum mobility during intense workouts.',
                'hoodies': 'Heavyweight hoodie with a modern fit. Stay warm before and after your training sessions.',
                'pants': 'Comfortable joggers with tapered fit. Ideal for training or rest days.',
                'tights': 'Compression tights that support your muscles during intense training.',
                'accessories': 'Essential gym accessory to keep you hydrated throughout your workout.'
            };

            detail.innerHTML = `
      <div class="product-media">
        <img src="${product.image}" alt="${product.name} — ${product.colour}"
             onerror="this.replaceWith(Object.assign(document.createElement('div'), {
               className: 'placeholder-media',
               innerHTML: '<span>${product.colour} — image pending</span>'
             }))">
      </div>
      <div class="product-info">
        <span class="eyebrow">${product.category} · ${product.colour}</span>
        <h1>${product.name}</h1>
        <span class="price">R${product.price}</span>
        <p class="product-description">${descriptions[product.category] || 'Premium gym wear designed for performance and comfort.'}</p>

        <div class="option-group">
            <span class="option-label">Size <a href="#" id="sizeGuideLink" style="color: var(--grip-blue); text-transform: none; font-family: var(--font-body); font-weight: 500;">— Size guide</a></span>
            <div class="size-options" id="sizeOptions">
            ${sizes.map(s => `<button class="size-btn${s === selectedSize ? ' active' : ''}" data-size="${s}">${s}</button>`).join('')}
          </div>
        </div>

        <div class="qty-row">
          <span class="option-label" style="margin:0;">Qty</span>
          <button id="qtyMinus">−</button>
          <span id="qtyValue">1</span>
          <button id="qtyPlus">+</button>
        </div>

        <button class="btn btn-primary" id="addToCartBtn">Add to cart</button>
        <div class="add-confirm" id="addConfirm">✓ Added to cart</div>
      </div>
      
      <!-- Size Guide Modal -->
      <div class="size-guide-modal" id="sizeGuideModal">
        <div class="size-guide-content">
          <button class="size-guide-close" id="sizeGuideClose">×</button>
          <h2 style="margin-bottom: 1rem;">Size Guide</h2>
          <p style="color: var(--steel); margin-bottom: 1rem;">All measurements are in centimeters and refer to body measurements.</p>
          <table class="size-guide-table">
            <thead>
              <tr>
                <th>Size</th>
                <th>Chest</th>
                <th>Waist</th>
                <th>Hip</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>S</td><td>86-91</td><td>71-76</td><td>86-91</td></tr>
              <tr><td>M</td><td>96-101</td><td>81-86</td><td>96-101</td></tr>
              <tr><td>L</td><td>106-111</td><td>91-96</td><td>106-111</td></tr>
              <tr><td>XL</td><td>116-121</td><td>101-106</td><td>116-121</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    document.querySelector('meta[name="description"]').setAttribute('content', `${product.name} in ${product.colour} — R${product.price}. Shop Grip On gym wear.`);
    
    // Size guide modal
    const sizeGuideLink = document.getElementById('sizeGuideLink');
    const sizeGuideModal = document.getElementById('sizeGuideModal');
    const sizeGuideClose = document.getElementById('sizeGuideClose');
    
    sizeGuideLink.addEventListener('click', (e) => {
        e.preventDefault();
        sizeGuideModal.classList.add('open');
    });
    
    sizeGuideClose.addEventListener('click', () => {
        sizeGuideModal.classList.remove('open');
    });
    
    sizeGuideModal.addEventListener('click', (e) => {
        if (e.target === sizeGuideModal) {
            sizeGuideModal.classList.remove('open');
        }
    });

    // Size selection
    document.getElementById('sizeOptions').addEventListener('click', e => {
      if (!e.target.matches('.size-btn')) return;
      selectedSize = e.target.dataset.size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b === e.target));
    });

    // Quantity controls
    document.getElementById('qtyPlus').addEventListener('click', () => {
      qty++; document.getElementById('qtyValue').textContent = qty;
    });
    document.getElementById('qtyMinus').addEventListener('click', () => {
      qty = Math.max(1, qty - 1); document.getElementById('qtyValue').textContent = qty;
    });

    // Add to cart with animation
    document.getElementById('addToCartBtn').addEventListener('click', () => {
        addToCart(product.id, selectedSize, qty);
        
        const btn = document.getElementById('addToCartBtn');
        const confirm = document.getElementById('addConfirm');
        
        btn.style.transform = 'scale(0.9)';
        setTimeout(() => {
            btn.style.transform = 'scale(1)';
        }, 150);
        
        confirm.style.display = 'block';
        setTimeout(() => {
            confirm.style.display = 'none';
        }, 2000);
        
        showToast(`Added ${product.name} to cart`, 'success');
        
        // Animate cart badge
        const cartCount = document.getElementById('cartCount');
        cartCount.classList.add('bump');
        setTimeout(() => {
            cartCount.classList.remove('bump');
        }, 400);
    });
    
    // Related products
    const relatedProducts = document.createElement('div');
    relatedProducts.className = 'related-products wrap';
    
    const allProducts = typeof PRODUCTS !== 'undefined' ? PRODUCTS : [];
    const related = allProducts.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
    
    if (related.length > 0) {
        relatedProducts.innerHTML = `
            <h2>You might also like</h2>
            <div class="product-grid">
                ${related.map(p => `
                    <a href="product.html?id=${p.id}" class="product-card">
                        <div class="product-card-media">
                            <img src="${p.image}" alt="${p.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {
                                className: 'placeholder-media',
                                innerHTML: '<span>${p.colour} — image pending</span>'
                            }))">
                        </div>
                        <div class="product-card-body">
                            <div class="product-card-cat">${p.category}</div>
                            <div class="product-card-name">${p.name}</div>
                            <div class="product-card-price price">R${p.price}</div>
                        </div>
                    </a>
                `).join('')}
            </div>
        `;
        
        document.querySelector('main').appendChild(relatedProducts);
    }
  }
    </script>

</body>


</html>
